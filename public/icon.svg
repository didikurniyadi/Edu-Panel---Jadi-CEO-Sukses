<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Screen / IFP Board -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- IFP Bezel & Screen -->
  <rect x="56" y="70" width="400" height="280" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="6" filter="url(#shadow)"/>
  <rect x="76" y="90" width="360" height="240" rx="16" fill="#1e293b"/>
  
  <!-- Screen Elements: Chart & Idea Lightbulb -->
  <path d="M110 270 L170 210 L230 240 L300 160 L370 190" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="110" cy="270" r="7" fill="#38bdf8"/>
  <circle cx="170" cy="210" r="7" fill="#38bdf8"/>
  <circle cx="230" cy="240" r="7" fill="#38bdf8"/>
  <circle cx="300" cy="160" r="7" fill="#38bdf8"/>
  <circle cx="370" cy="190" r="7" fill="#f59e0b"/>
  
  <!-- Lightbulb (Entrepreneurship Idea) -->
  <circle cx="256" cy="150" r="32" fill="url(#goldGrad)"/>
  <path d="M244 182 L268 182 M248 188 L264 188" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M256 100 L256 112 M215 116 L224 124 M297 116 L288 124" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>

  <!-- IFP Stand / Base -->
  <rect x="236" y="350" width="40" height="60" fill="#475569" rx="4"/>
  <rect x="180" y="406" width="152" height="16" fill="#334155" rx="8"/>

  <!-- Interactive Stylus Pen -->
  <g transform="translate(350, 290) rotate(-35)">
    <rect x="0" y="0" width="18" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M0 110 L9 130 L18 110 Z" fill="#0284c7"/>
    <rect x="0" y="20" width="18" height="10" fill="#38bdf8"/>
  </g>
</svg>
